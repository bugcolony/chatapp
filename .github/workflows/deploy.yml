name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.PRODUCTION_URL }}
          NUXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
          NUXT_PUBLIC_WS_URL: ${{ vars.NUXT_PUBLIC_WS_URL || 'wss://chat.example.com/ws' }}
          NUXT_AUTH_TIMEOUT: 10000

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ws/go.mod
          cache-dependency-path: ws/go.sum

      - name: Check WebSocket formatting
        run: test -z "$(gofmt -l .)"
        working-directory: ws

      - name: Test WebSocket gateway
        run: go test ./...
        working-directory: ws

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, sqlite3, redis, pcntl, zip
          tools: composer:v2

      - name: Install backend dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        working-directory: backend

      - name: Validate backend Composer config
        run: composer validate --strict --no-interaction
        working-directory: backend

      - name: Test backend
        run: composer test
        working-directory: backend

      - name: Validate production Compose config
        run: docker compose --env-file .env.production.example -f compose.yaml config --quiet

  deploy:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/do_deploy
          printf '%s\n' "${{ secrets.DO_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/do_deploy
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on Droplet
        run: |
          ssh -i ~/.ssh/do_deploy -o IdentitiesOnly=yes "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}" bash -s -- "${{ vars.APP_DIR }}" "${{ github.sha }}" <<'REMOTE'
          set -euo pipefail

          APP_DIR="$1"
          SHA="$2"

          cd "$APP_DIR"

          git fetch --prune origin main
          git checkout --force "$SHA"

          docker compose --env-file .env.production -f compose.yaml config --quiet
          docker compose --env-file .env.production -f compose.yaml build --pull
          docker compose --env-file .env.production -f compose.yaml up -d --remove-orphans --wait --wait-timeout 300
          docker compose --env-file .env.production -f compose.yaml ps
          REMOTE

      - name: Smoke test
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 5 --retry-all-errors \
            "${{ vars.PRODUCTION_URL }}/api/health"
