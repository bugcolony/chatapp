name: ${COMPOSE_PROJECT_NAME:-chat}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-laravel-environment: &laravel-environment
  APP_NAME: ${APP_NAME:-Chat}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:?APP_URL is required}
  APP_FRONTEND_URL: ${APP_FRONTEND_URL:?APP_FRONTEND_URL is required}
  APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-cache}
  APP_MAINTENANCE_STORE: ${APP_MAINTENANCE_STORE:-redis}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_STACK: ${LOG_STACK:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-chat}
  DB_USERNAME: ${POSTGRES_USER:-chat}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  SESSION_CONNECTION: ${SESSION_CONNECTION:-ops}
  SESSION_STORE: ${SESSION_STORE:-redis}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-43200}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CACHE_STORE: ${CACHE_STORE:-redis}
  REDIS_CACHE_CONNECTION: ${REDIS_CACHE_CONNECTION:-ops_cache}
  REDIS_CACHE_LOCK_CONNECTION: ${REDIS_CACHE_LOCK_CONNECTION:-ops}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
  REDIS_QUEUE_CONNECTION: ${REDIS_QUEUE_CONNECTION:-ops}
  REDIS_QUEUE: ${REDIS_QUEUE:-default}
  REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER:-90}
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_PREFIX: ${REDIS_PREFIX:-}
  REDIS_OPS_HOST: redis-ops
  REDIS_OPS_PORT: 6379
  REDIS_OPS_PASSWORD: ${REDIS_OPS_PASSWORD:?REDIS_OPS_PASSWORD is required}
  REDIS_OPS_DB: ${REDIS_OPS_DB:-0}
  REDIS_OPS_CACHE_DB: ${REDIS_OPS_CACHE_DB:-1}
  REDIS_REALTIME_HOST: redis-realtime
  REDIS_REALTIME_PORT: 6379
  REDIS_REALTIME_PASSWORD: ${REDIS_REALTIME_PASSWORD:?REDIS_REALTIME_PASSWORD is required}
  REDIS_REALTIME_DB: ${REDIS_REALTIME_DB:-0}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-s3}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_BUCKET: ${AWS_BUCKET:?AWS_BUCKET is required}
  AWS_ENDPOINT: ${AWS_ENDPOINT:-http://rustfs:9000}
  AWS_URL: ${AWS_URL:-}
  AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
  MAIL_PORT: ${MAIL_PORT:-1025}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Chat}
  HORIZON_ALLOWED_EMAILS: ${HORIZON_ALLOWED_EMAILS:-}
  HORIZON_PATH: ${HORIZON_PATH:-horizon}
  TELESCOPE_ENABLED: ${TELESCOPE_ENABLED:-false}
  TELESCOPE_PATH: ${TELESCOPE_PATH:-telescope}
  TELESCOPE_SLOW_QUERY_THRESHOLD: ${TELESCOPE_SLOW_QUERY_THRESHOLD:-100}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  VIEW_COMPILED_PATH: /tmp/laravel/views

x-laravel-service: &laravel-service
  build:
    context: .
    dockerfile: docker/api/Dockerfile
    target: api-php
  working_dir: /var/www/html
  environment:
    <<: *laravel-environment
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp
    - /var/tmp
    - /run
    - /var/www/html/bootstrap/cache:mode=1777
  logging: *default-logging
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'
      reservations:
        memory: 256M
        cpus: '0.5'

services:
  docker-proxy:
    build:
      context: .
      dockerfile: docker/socket-proxy/Dockerfile
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run
    networks:
      - docker-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'

  edge:
    build:
      context: .
      dockerfile: docker/edge/Dockerfile
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=true
      - --ping=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker.endpoint=tcp://docker-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-chat}_edge
      - '--providers.docker.constraints=Label(`chat.stack`,`${COMPOSE_PROJECT_NAME:-chat}`)'
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
      - --certificatesresolvers.default.acme.email=${TRAEFIK_ACME_EMAIL:-ops@example.com}
      - --certificatesresolvers.default.acme.storage=/acme/acme.json
      - --certificatesresolvers.default.acme.httpchallenge=true
      - --certificatesresolvers.default.acme.httpchallenge.entrypoint=web
    environment:
      DOCKER_API_VERSION: ${TRAEFIK_DOCKER_API_VERSION:-1.44}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/edge/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - traefik_acme:/acme
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp
    networks:
      - edge-net
      - docker-net
    depends_on:
      docker-proxy:
        condition: service_healthy
      frontend:
        condition: service_healthy
      api-web:
        condition: service_healthy
      ws:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: frontend-prod
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://chat.example.com}
        NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-https://chat.example.com}
        NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-wss://chat.example.com/ws}
        NUXT_AUTH_TIMEOUT: ${NUXT_AUTH_TIMEOUT:-10000}
    networks:
      - edge-net
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - chat.stack=${COMPOSE_PROJECT_NAME:-chat}
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-frontend.rule=Host(`${APP_DOMAIN:-chat.example.com}`)'
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-frontend.entrypoints=${TRAEFIK_ROUTER_ENTRYPOINTS:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-frontend.tls=${TRAEFIK_ROUTER_TLS:-true}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-frontend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-default}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-frontend.priority=1
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-frontend.middlewares=secure-headers@file,gzip@file
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-chat}-frontend.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'

  api-php:
    <<: *laravel-service
    networks:
      - api-net
      - ops-net
      - realtime-net
      - egress-net
    depends_on:
      postgres:
        condition: service_healthy
      redis-ops:
        condition: service_healthy
      redis-realtime:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api-web:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: api-web
    networks:
      - edge-net
      - api-net
    depends_on:
      api-php:
        condition: service_started
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - chat.stack=${COMPOSE_PROJECT_NAME:-chat}
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-api.rule=Host(`${APP_DOMAIN:-chat.example.com}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/sanctum`) || PathPrefix(`/${HORIZON_PATH:-horizon}`) || Path(`/up`))'
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-api.entrypoints=${TRAEFIK_ROUTER_ENTRYPOINTS:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-api.tls=${TRAEFIK_ROUTER_TLS:-true}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-default}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-api.priority=100
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-api.middlewares=secure-headers@file,gzip@file
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-chat}-api.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.75'
        reservations:
          memory: 128M
          cpus: '0.5'

  migrate:
    <<: *laravel-service
    command: ["/docker/laravel/migrate.sh"]
    networks:
      - ops-net
    depends_on:
      postgres:
        condition: service_healthy
      redis-ops:
        condition: service_healthy
    restart: "no"

  horizon:
    <<: *laravel-service
    command: ["/docker/laravel/horizon.sh"]
    networks:
      - ops-net
      - egress-net
    depends_on:
      postgres:
        condition: service_healthy
      redis-ops:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi 'running' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  scheduler:
    <<: *laravel-service
    command: ["/docker/laravel/scheduler.sh"]
    networks:
      - ops-net
      - egress-net
    depends_on:
      postgres:
        condition: service_healthy
      redis-ops:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  composer:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: composer-dev
    profiles: ["tools"]
    working_dir: /var/www/html
    environment:
      <<: *laravel-environment
    tmpfs:
      - /var/www/html/bootstrap/cache:mode=1777
    networks:
      - ops-net
      - realtime-net
      - egress-net
    depends_on:
      postgres:
        condition: service_healthy
      redis-ops:
        condition: service_healthy
      redis-realtime:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    restart: "no"

  ws:
    build:
      context: .
      dockerfile: docker/ws/Dockerfile
      target: ws-prod
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: ${WS_PORT:-8080}
      REDIS_HOST: redis-realtime
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_REALTIME_PASSWORD:?REDIS_REALTIME_PASSWORD is required}
      REDIS_DB: ${REDIS_REALTIME_DB:-0}
      REDIS_CHANNEL: ${REDIS_CHANNEL:-messages.created}
    networks:
      - edge-net
      - realtime-net
    depends_on:
      redis-realtime:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    labels:
      - traefik.enable=true
      - chat.stack=${COMPOSE_PROJECT_NAME:-chat}
      - traefik.docker.network=${COMPOSE_PROJECT_NAME:-chat}_edge
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-ws.rule=Host(`${APP_DOMAIN:-chat.example.com}`) && PathPrefix(`/ws`)'
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-ws.entrypoints=${TRAEFIK_ROUTER_ENTRYPOINTS:-websecure}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-ws.tls=${TRAEFIK_ROUTER_TLS:-true}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-ws.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-default}
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-ws.priority=110
      - traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-ws.middlewares=secure-headers@file
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-chat}-ws.loadbalancer.server.port=${WS_PORT:-8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${WS_PORT:-8080}/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chat}
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=3777
    networks:
      - ops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

  redis-ops:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    command: ["sh", "-ec", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_OPS_PASSWORD:?REDIS_OPS_PASSWORD is required}
    volumes:
      - ./docker/redis/ops.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_ops_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - ops-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  redis-realtime:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    command: ["sh", "-ec", "exec redis-server /usr/local/etc/redis/redis.conf --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_REALTIME_PASSWORD:?REDIS_REALTIME_PASSWORD is required}
    volumes:
      - ./docker/redis/realtime.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_realtime_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - realtime-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.5'

  rustfs:
    build:
      context: .
      dockerfile: docker/rustfs/Dockerfile
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_ENVIRONMENT: production
      RUSTFS_OBS_LOG_DIRECTORY: ""
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - rustfs_data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    networks:
      - ops-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

networks:
  api-net:
    name: ${COMPOSE_PROJECT_NAME:-chat}_api
    internal: true
  docker-net:
    internal: true
  edge-net:
    name: ${COMPOSE_PROJECT_NAME:-chat}_edge
  egress-net:
    name: ${COMPOSE_PROJECT_NAME:-chat}_egress
  ops-net:
    name: ${COMPOSE_PROJECT_NAME:-chat}_ops
    internal: true
  realtime-net:
    name: ${COMPOSE_PROJECT_NAME:-chat}_realtime
    internal: true

volumes:
  traefik_acme:
  postgres_data:
  redis_ops_data:
  redis_realtime_data:
  rustfs_data:
