services:
  edge:
    command: []
    ports:
      - "80:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_EXPOSE_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: frontend-dev
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
        NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-}
        NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-ws://localhost/ws}
        NUXT_AUTH_TIMEOUT: ${NUXT_AUTH_TIMEOUT:-10000}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-}
      NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-ws://localhost/ws}
      NUXT_AUTH_TIMEOUT: ${NUXT_AUTH_TIMEOUT:-10000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    read_only: false
    tmpfs: []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      traefik.http.routers.frontend.rule: PathPrefix(`/`)
      traefik.http.services.frontend.loadbalancer.server.port: "3000"

  api-php:
    volumes:
      - ./backend:/var/www/html
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp
      - /run

  api-web:
    volumes:
      - ./backend/public:/var/www/html/public:ro
    labels:
      traefik.http.routers.api.rule: PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/sanctum`) || PathPrefix(`/${HORIZON_PATH:-horizon}`) || PathPrefix(`/${TELESCOPE_PATH:-telescope}`) || Path(`/up`)

  migrate:
    volumes:
      - ./backend:/var/www/html
    read_only: false

  horizon:
    volumes:
      - ./backend:/var/www/html
    read_only: false

  scheduler:
    volumes:
      - ./backend:/var/www/html
    read_only: false

  composer:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer
    volumes:
      - ./backend:/var/www/html
      - composer_cache:/tmp/composer
    read_only: false
    tmpfs: []

  ws:
    build:
      context: .
      dockerfile: docker/ws/Dockerfile
      target: ws-dev
    command: ["sh", "-ec", "mkdir -p /go-cache/build /go-cache/mod /go-cache/tmp && exec go run ./cmd/web"]
    environment:
      GOCACHE: /go-cache/build
      GOMODCACHE: /go-cache/mod
      GOTMPDIR: /go-cache/tmp
    volumes:
      - ./ws:/app
      - ws_gocache:/go-cache
    read_only: false
    tmpfs: []
    labels:
      traefik.http.routers.ws.rule: PathPrefix(`/ws`)

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSE_PORT:-5432}:5432"

  redis-ops:
    ports:
      - "127.0.0.1:${REDIS_OPS_EXPOSE_PORT:-6379}:6379"

  redis-realtime:
    ports:
      - "127.0.0.1:${REDIS_REALTIME_EXPOSE_PORT:-6380}:6379"

  rustfs:
    ports:
      - "127.0.0.1:${RUSTFS_API_EXPOSE_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_EXPOSE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:v1.24
    networks:
      - ops-net
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_EXPOSE_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_EXPOSE_PORT:-8025}:8025"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    networks:
      - ops-net
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-password}
    ports:
      - "127.0.0.1:${PGADMIN_EXPOSE_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:2.70
    networks:
      - ops-net
      - realtime-net
    ports:
        - "127.0.0.1:${REDISINSIGHT_EXPOSE_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped

volumes:
  composer_cache:
  frontend_node_modules:
  frontend_nuxt:
  pgadmin_data:
  redisinsight_data:
  ws_gocache:
