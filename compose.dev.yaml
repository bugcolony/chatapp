services:
  edge:
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --entrypoints.web.address=:80
      - --providers.docker.endpoint=tcp://docker-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${COMPOSE_PROJECT_NAME:-chat}_edge
      - '--providers.docker.constraints=Label(`chat.stack`,`${COMPOSE_PROJECT_NAME:-chat}`)'
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=INFO
      - --accesslog=true
    ports: !override
      - "80:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_EXPOSE_PORT:-8080}:8080"
    depends_on: !override
      docker-proxy:
        condition: service_healthy
      frontend:
        condition: service_started
      api-web:
        condition: service_healthy
      ws:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: frontend-dev
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
        NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-}
        NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-ws://localhost/ws}
        NUXT_PUBLIC_RTC_URL: ${NUXT_PUBLIC_RTC_URL:-ws://localhost}
        NUXT_PUBLIC_KLIPY_API_KEY: ${NUXT_PUBLIC_KLIPY_API_KEY:-}
        NUXT_AUTH_TIMEOUT: ${NUXT_AUTH_TIMEOUT:-10000}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-}
      NUXT_PUBLIC_WS_URL: ${NUXT_PUBLIC_WS_URL:-ws://localhost/ws}
      NUXT_PUBLIC_RTC_URL: ${NUXT_PUBLIC_RTC_URL:-ws://localhost}
      NUXT_PUBLIC_KLIPY_API_KEY: ${NUXT_PUBLIC_KLIPY_API_KEY:-}
      NUXT_AUTH_TIMEOUT: ${NUXT_AUTH_TIMEOUT:-10000}
      NUXT_DEVTOOLS_ENABLED: ${NUXT_DEVTOOLS_ENABLED:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt
    read_only: false
    tmpfs: []
    healthcheck:
      disable: true
    deploy: !reset null
    labels:
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-frontend.rule=PathPrefix(`/`)'
      - traefik.http.services.${COMPOSE_PROJECT_NAME:-chat}-frontend.loadbalancer.server.port=3000

  api-php:
    build:
      target: api-php-dev
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    read_only: false
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
      - /var/www/html/bootstrap/cache:mode=1777

  api-web:
    volumes:
      - ./backend/public:/var/www/html/public:ro
    labels:
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-api.rule=PathPrefix(`/api`) || PathPrefix(`/auth`) || PathPrefix(`/sanctum`) || PathPrefix(`/${HORIZON_PATH:-horizon}`) || PathPrefix(`/${TELESCOPE_PATH:-telescope}`) || Path(`/up`)'

  migrate:
    build:
      target: api-php-dev
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    read_only: false

  horizon:
    build:
      target: api-php-dev
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    read_only: false

  scheduler:
    build:
      target: api-php-dev
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    read_only: false

  composer:
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
      - composer_cache:/tmp/composer
    read_only: false
    tmpfs:
      - /var/www/html/bootstrap/cache:mode=1777

  ws:
    build:
      context: .
      dockerfile: docker/ws/Dockerfile
      target: ws-dev
    command: ["sh", "-ec", "mkdir -p /go-cache/build /go-cache/mod /go-cache/tmp && exec go run ./cmd/web"]
    environment:
      GOCACHE: /go-cache/build
      GOMODCACHE: /go-cache/mod
      GOTMPDIR: /go-cache/tmp
    volumes:
      - ./ws:/app
      - ws_gocache:/go-cache
    read_only: false
    tmpfs: []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${WS_PORT:-8080}/health >/dev/null 2>&1 || exit 1"]
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    labels:
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-ws.rule=PathPrefix(`/ws`)'

  livekit:
    ports: !override
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    deploy: !reset null
    labels:
      - 'traefik.http.routers.${COMPOSE_PROJECT_NAME:-chat}-livekit.rule=PathPrefix(`/rtc`)'

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_EXPOSE_PORT:-5432}:5432"

  redis-ops:
    ports:
      - "127.0.0.1:${REDIS_OPS_EXPOSE_PORT:-6379}:6379"

  redis-realtime:
    ports:
      - "127.0.0.1:${REDIS_REALTIME_EXPOSE_PORT:-6380}:6379"

  rustfs:
    environment:
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${RUSTFS_API_EXPOSE_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_EXPOSE_PORT:-9001}:9001"

  mailpit:
    image: axllent/mailpit:v1.24
    networks:
      - ops-net
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_EXPOSE_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_EXPOSE_PORT:-8025}:8025"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["tools"]
    networks:
      - ops-net
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-local-password}
    ports:
      - "127.0.0.1:${PGADMIN_EXPOSE_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:2.70
    networks:
      - ops-net
      - realtime-net
    ports:
        - "127.0.0.1:${REDISINSIGHT_EXPOSE_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    restart: unless-stopped

volumes:
  backend_vendor:
  composer_cache:
  frontend_node_modules:
  frontend_nuxt:
  pgadmin_data:
  redisinsight_data:
  ws_gocache:

networks:
  ops-net:
    internal: false
  realtime-net:
    internal: false
